const TOTAL = questions.length;
let userAnswers = {};
let answeredCount = 0;
let correctCount = 0;

function buildQuestions() {
  const container = document.getElementById('questions-container');
  questions.forEach(q => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${q.num}`;

    const qtext = q.text ? `<p class="q-text">${q.text}</p>` : '';
    const prompt = q.prompt ? `<p class="q-prompt">${q.prompt}</p>` : '';

    const opts = q.options.map((opt, i) =>
      `<button class="opt-btn" id="opt-${q.num}-${i+1}" onclick="answer(${q.num}, ${i+1})">${opt}</button>`
    ).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${q.num}</div>
        <div>${qtext}${prompt}</div>
      </div>
      <div class="options">${opts}</div>
    `;
    container.appendChild(card);
  });
}

function answer(qNum, chosen) {
  if (userAnswers[qNum] !== undefined) return;
  userAnswers[qNum] = chosen;
  answeredCount++;
  const q = questions.find(q => q.num === qNum);
  const isCorrect = chosen === q.correct;
  if (isCorrect) correctCount++;

  q.options.forEach((_, i) => {
    const btn = document.getElementById(`opt-${qNum}-${i+1}`);
    btn.classList.add('answered');
    if (i + 1 === q.correct) btn.classList.add('correct');
    else if (i + 1 === chosen) btn.classList.add('wrong');
  });

  updateScore();
  if (answeredCount === TOTAL) {
    document.getElementById('finish-btn').style.display = 'block';
  }
}

function updateScore() {
  document.getElementById('score-display').textContent = `${correctCount} / ${TOTAL}`;
  const pct = (answeredCount / TOTAL) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function showResults() {
  document.getElementById('finish-btn').style.display = 'none';
  const resultsEl = document.getElementById('results');
  resultsEl.style.display = 'block';
  document.getElementById('final-score').textContent = `${correctCount}/${TOTAL}`;
  const pct = Math.round((correctCount / TOTAL) * 100);
  document.getElementById('percent-text').textContent = `${pct}% rätt`;

  const wrongList = document.getElementById('wrong-list');
  const wrongQs = questions.filter(q => userAnswers[q.num] !== q.correct);
  if (wrongQs.length === 0) {
    wrongList.innerHTML = '<p style="color:#28a745;font-weight:600;">Perfekt! Alla rätt!</p>';
  } else {
    const items = wrongQs.map(q => {
      const yourAns = q.options[userAnswers[q.num] - 1];
      const rightAns = q.options[q.correct - 1];
      return `<div class="wrong-item"><strong>Fråga ${q.num}:</strong> Du svarade <em>"${yourAns}"</em> – rätt svar: <strong>"${rightAns}"</strong></div>`;
    }).join('');
    wrongList.innerHTML = `<h3>Fel svar (${wrongQs.length} st):</h3>${items}`;
  }
  resultsEl.scrollIntoView({ behavior: 'smooth' });
}

buildQuestions();
</script>
